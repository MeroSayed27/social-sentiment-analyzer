<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arabic-English Sentiment Engine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6f9; font-family: 'Segoe UI', system-ui, sans-serif; color: #333; }
        .main-container { max-width: 650px; margin: 60px auto; }
        .card { border: none; border-radius: 16px; box-shadow: 0 4px 25px rgba(0,0,0,0.04); background: white; padding: 30px; transition: all 0.3s ease; }
        .btn-primary { background: #0d6efd; border: none; font-weight: 600; padding: 12px; border-radius: 10px; width: 100%; }
        .btn-primary:hover { background: #0b5ed7; transform: translateY(-1px); }
        .badge-negative { background-color: #f8d7da; color: #842029; font-weight: bold; border: 1px solid #f5c2c7; padding: 6px 14px; border-radius: 6px; }
        .badge-positive { background-color: #d1e7dd; color: #0f5132; font-weight: bold; border: 1px solid #badbcc; padding: 6px 14px; border-radius: 6px; }
    </style>
</head>
<body>

    <div class="container main-container">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-dark">Arabic-English Sentiment Engine</h2>
            <p class="text-muted">Live Machine Learning Production Testing Gateway</p>
        </div>

        <div class="card mb-4">
            <div class="mb-3">
                <label class="form-label fw-semibold text-secondary">Input Text / النص المدخل</label>
                <textarea id="textInput" class="form-control" rows="3" placeholder="Type mixed Arabic/English text..."></textarea>
            </div>
            <button onclick="sendPredictionRequest()" class="btn btn-primary shadow-sm">Analyze Sentiment</button>
        </div>

        <div id="resultCard" class="card d-none">
            <h5 class="fw-bold text-dark mb-3">Analysis Report Matrix</h5>
            <div class="d-flex align-items-center mb-3">
                <span class="text-muted me-3">Predicted Classification:</span>
                <span id="labelOutput"></span>
            </div>
            <div class="text-muted small fw-bold mb-2">Confidence Score Distributions:</div>
            <div id="metricsOutput" class="font-monospace text-secondary"></div>
        </div>
    </div>

    <script>
        async function sendPredictionRequest() {
            const textValue = document.getElementById('textInput').value.trim();
            if(!textValue) return alert('Please enter text.');

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: textValue })
                });
                const data = await response.json();
                
                document.getElementById('resultCard').classList.remove('d-none');
                const badge = document.getElementById('labelOutput');
                
                if(data.classification === 'NEGATIVE') {
                    badge.innerText = 'NEGATIVE';
                    badge.className = 'badge-negative';
                } else {
                    badge.innerText = 'POSITIVE';
                    badge.className = 'badge-positive';
                }

                document.getElementById('metricsOutput').innerHTML = `
                    <div class="d-flex justify-content-between border-bottom py-2"><span>🔴 negative:</span> <strong>${data.confidence_matrix.negative}%</strong></div>
                    <div class="d-flex justify-content-between py-2"><span>🟢 positive:</span> <strong>${data.confidence_matrix.positive}%</strong></div>
                `;
            } catch (err) {
                alert('Connection failure to FastAPI.');
            }
        }
    </script>
</body>
</html>
